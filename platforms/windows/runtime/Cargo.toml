[package]
name = "dinput8"
version = "0.2.0"
edition = "2021"
description = "Русификатор Labyrinth of Refrain: прокси dinput8.dll, ресурсы перевода внутри самой DLL"

[lib]
name = "dinput8"
crate-type = ["cdylib", "rlib"]

[dependencies]
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
opt-level = 2
panic = "abort"
lto = true
codegen-units = 1
