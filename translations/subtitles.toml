[[subtitles]]
voice = "vs_0001_0002"
duration = 30.1
text = "Добро пожаловать в Сумеречный театр. Вас ждёт история, полная странных и удивительных событий. А в самом её сердце лежит таинственная книга."

[[subtitles]]
voice = "vs_0001_0003"
duration = 26.7
text = "Вас ждёт история, полная странных и удивительных событий. А в самом её сердце лежит таинственная книга."

[[subtitles]]
voice = "vs_0001_0004"
duration = 3.7
text = "Буду ждать вашего возвращения."

[[subtitles]]
voice = "vs_0001_0005"
duration = 9.6
text = "Я вас заждалась. Что ж, позвольте продолжить эту историю."

[[subtitles]]
voice = "vs_0001_0006"
duration = 11.9
text = "Благодарю вас. В иное время, в ином месте мы встретимся вновь. Конец."

[[subtitles]]
voice = "vs_0001_0007"
duration = 15.3
text = "Как вам история? Надеюсь, вы придёте и за следующей. А пока мне пора опустить занавес. До новой встречи."

